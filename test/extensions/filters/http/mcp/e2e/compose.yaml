# Docker Compose setup of the MCP filter end-to-end test. The official MCP Python SDK runs in an
# MCP client and an MCP server, with the official Envoy image between them:
#
#   mcp-client -> envoy:10000 (envoy.filters.http.mcp -> router) -> mcp-server:8000
#
# It runs the 17 regression cases, or with DEMO=1 the developer demo. From this directory:
#
#   docker compose up --build --abort-on-container-exit --exit-code-from mcp-client
#   DEMO=1 docker compose up --build --abort-on-container-exit --exit-code-from mcp-client
#   docker compose down -v
#
# See README.md.

name: mcp-e2e

# Where the services find each other, and the run directory that they share.
x-e2e-environment: &e2e-environment
  ENVOY_HOST: envoy
  ENVOY_PORT: "10000"
  ENVOY_CAPPED_PORT: "10001"
  ENVOY_ADMIN_PORT: "9901"
  MCP_SERVER_HOST: mcp-server
  MCP_SERVER_PORT: "8000"
  E2E_RUN_DIR: /e2e-run
  DEMO: "${DEMO:-0}"

# The test's sources, read-only, and the run directory: a volume, or with RUN_DIR set, that host
# directory.
x-e2e-volumes: &e2e-volumes
- .:/e2e:ro
- ${RUN_DIR:-run}:/e2e-run

# The Python image of the client and the server: mcp==2.2.0, from docker/requirements.txt.
x-python-service: &python-service
  build: ./docker
  image: envoy-mcp-e2e-python:mcp-2.2.0
  # The image is built here, from docker/, and never pulled: no registry has it.
  pull_policy: build
  # An init process that passes on signals, so that the service stops at once.
  init: true
  volumes: *e2e-volumes

services:
  mcp-server:
    <<: *python-service
    environment:
      <<: *e2e-environment
    command: ["sh", "docker/server_entrypoint.sh"]
    healthcheck:
      # The server accepts connections once the SDK's session manager runs. A connection with no
      # request, so that health checks are not in the server's request log.
      test:
      - CMD
      - python
      - -c
      - import os, socket; socket.create_connection(('127.0.0.1', int(os.environ['MCP_SERVER_PORT'])), timeout=2).close()
      interval: 1s
      timeout: 3s
      retries: 30

  envoy:
    # The official Envoy development image of main commit 158e9b65ca, which has the MCP filter's
    # 2026-07-28 support, including envoyproxy/envoy#47915 and #47862. Verified by its binary's
    # revision, and with the 17 regression cases. Pinned by digest. ENVOY_IMAGE overrides it; the
    # image needs /bin/sh and /docker-entrypoint.sh, which the distroless variants do not have.
    # yamllint disable-line rule:line-length
    image: ${ENVOY_IMAGE:-envoyproxy/envoy:dev-158e9b65ca983e1d37b6ec078ab017b5bab61f6e@sha256:344a56243e7eb8676ec4346ac46a20acb575f677257249099a50b65950d3b5e4}
    depends_on:
      mcp-server:
        condition: service_healthy
    environment:
      <<: *e2e-environment
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # The image's entrypoint keeps Envoy as root, so that Envoy can write its access log into the
      # run directory, which the other services also write as root.
      ENVOY_UID: "0"
    entrypoint: ["sh", "/e2e/docker/envoy_entrypoint.sh"]
    volumes: *e2e-volumes

  mcp-client:
    <<: *python-service
    depends_on:
      mcp-server:
        condition: service_healthy
      # The client waits for Envoy's /ready itself: the Envoy image has no curl or wget.
      envoy:
        condition: service_started
    environment:
      <<: *e2e-environment
      SKIP_CASES: "${SKIP_CASES:-}"
      # The revision of the pinned Envoy image. The client warns when Envoy is another one.
      VERIFIED_ENVOY_REVISION: 158e9b65ca983e1d37b6ec078ab017b5bab61f6e
    command: ["python", "-u", "docker/client_entrypoint.py"]

volumes:
  run: {}
